
name: Deploy AutoEdit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Stamp and verify the Studio 3.0 release
        run: |
          node -e 'const fs=require("node:fs");fs.writeFileSync("dist/version.json",JSON.stringify({app:"AutoEdit Studio",ui:"scene-studio-3.0",commit:process.env.GITHUB_SHA,builtAt:new Date().toISOString()},null,2))'
          grep -Rq "STUDIO 3.0" dist/assets/ || { echo "::error::New editor UI was not included in the release"; exit 1; }
          test -f dist/index.html
          echo "Publishing multitrack editor from commit ${GITHUB_SHA}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify GitHub Pages has the newly released version
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ -z "$PUBLIC_URL" ]; then
            echo "::error::GitHub Pages returned no public URL"; exit 1
          fi
          for n in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 20 "${PUBLIC_URL%/}/version.json?sha=${GITHUB_SHA}&check=${n}" | grep -q "${GITHUB_SHA}"; then
              echo "GitHub Pages serves Studio 3.0 commit ${GITHUB_SHA}"
              exit 0
            fi
            echo "Waiting for GitHub Pages to serve commit ${GITHUB_SHA} (check ${n}/18)"
            sleep 5
          done
          echo "::error::Published site is not serving the expected Studio 3.0 revision"
          exit 1
