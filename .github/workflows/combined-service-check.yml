name: Check combined AutoEdit service

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "render.yaml"
      - "src/**"
      - "backend/**"
      - "package.json"
      - "vite.config.js"
      - ".github/workflows/combined-service-check.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "render.yaml"
      - ".github/workflows/combined-service-check.yml"

jobs:
  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build combined frontend + backend container
        run: docker build -t autoedit-combined:ci .
      - name: Verify app loads and importer health endpoint responds
        run: |
          docker run -d --name autoedit-ci -p 8080:8080 -e AUTOEDIT_API_KEY=ci-test-only autoedit-combined:ci
          trap 'docker logs autoedit-ci; docker rm -f autoedit-ci' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/ | grep -q "AutoEdit"
          curl -fsS http://localhost:8080/assets/ 2>/dev/null && exit 1 || true
