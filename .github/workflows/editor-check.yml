name: Verify editing workspace and portrait geometry

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - ".github/workflows/editor-check.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/editor-check.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test composition crop calculations
        run: node --test src/renderGeometry.test.mjs
      - name: Build editing workspace
        run: npm run build
